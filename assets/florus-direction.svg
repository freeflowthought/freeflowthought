<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="t d"><title id="t">The Florus direction</title><desc id="d">Marketing, sales and customer service connected through shared memory, evidence and human review. Product direction, not a shipped architecture claim.</desc><rect width="1200" height="260" fill="#1c2523"/><g font-family="Arial,Helvetica,sans-serif"><text x="40" y="46" font-size="17" letter-spacing="3" fill="#d1d8ce">FLORUS / THE DESIGN DIRECTION</text><g font-size="37" font-weight="700" fill="#f3f0e7"><text x="40" y="125">Marketing</text><text x="459" y="125">Sales</text><text x="790" y="125">Customer service</text></g><g stroke="#ee542d" fill="none" stroke-width="3"><path d="M270 112H409m-14-10 14 10-14 10M600 112H740m-14-10 14 10-14 10"/><path d="M40 166H1160"/></g><text x="40" y="220" font-size="24" fill="#f3f0e7">Shared memory. Evidence from real work. Human-approved improvement.</text></g></svg>